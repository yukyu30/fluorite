name: tagpr

on:
  push:
    branches:
      - main

# Avoid overlapping release runs.
concurrency:
  group: tagpr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags / releases and push the release PR
      pull-requests: write # create / update the release PR
      issues: read # read labels for version bump detection
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tagpr needs full history + tags
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Maintains the release PR; on merge, tags and creates a GitHub Release.
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate, environment-gated job so protection rules apply only to publishing
  # (not to tagpr's release-PR maintenance on every push to main).
  publish:
    needs: tagpr
    if: needs.tagpr.outputs.tag != '' # only when the release PR was just merged
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@yukyu30/fluorite
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing (OIDC) needs npm >= 11.5.1; runners ship npm 10.
      - run: npm install -g npm@latest
      - run: npm ci

      # No NPM_TOKEN: auth is via OIDC; provenance is generated automatically.
      # `npm publish` runs the build via prepublishOnly.
      - run: npm publish --access public
