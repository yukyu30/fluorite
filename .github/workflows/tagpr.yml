name: tagpr

on:
  push:
    branches:
      - main

# Avoid overlapping release runs.
concurrency:
  group: tagpr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags / releases and push the release PR
      pull-requests: write # create / update the release PR
      issues: read # read labels for version bump detection
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tagpr needs full history + tags
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Maintains the release PR; on merge, tags and creates a GitHub Release.
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trusted publishing (OIDC) needs npm >= 11.5.1; runners ship npm 10.
      - name: Upgrade npm for trusted publishing
        if: steps.tagpr.outputs.tag != ''
        run: npm install -g npm@latest

      # Runs only on the push that tagpr just tagged (release PR merged).
      # No NPM_TOKEN: auth is via OIDC; provenance is generated automatically.
      - name: Publish to npm
        if: steps.tagpr.outputs.tag != ''
        run: npm publish --access public
